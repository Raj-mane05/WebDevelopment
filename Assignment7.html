<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Link Example</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 600px;
            width: 100%;
        }
        h1 {
            color: #4285F4;
            text-align: center;
            margin-bottom: 30px;
        }
        .link-section {
            margin: 20px 0;
            padding: 15px;
            border-radius: 8px;
            background-color: #f8f9fa;
        }
        p {
            color: #5f6368;
            margin-bottom: 10px;
        }
        a {
            display: inline-block;
            padding: 10px 15px;
            background-color: #4285F4;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        a:hover {
            background-color: #3367D6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Google Links</h1>
        
        <div class="link-section">
            <p>Open in same window:</p>
            <a href="https://www.google.com">Visit Google</a>
        </div>
        
        <div class="link-section">
            <p>Open in new window:</p>
            <a href="https://www.google.com" target="_blank">Visit Google in new window</a>
        </div>
    </div>
</body>
</html>
