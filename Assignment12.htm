
<html>
<head>
    <title>Fruit Price List</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #e0f7fa 0%, #80deea 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            padding: 30px;
        }
        h2 {
            color: #00796b;
            text-align: center;
            margin-bottom: 30px;
            font-size: 32px;
            position: relative;
            font-weight: 600;
        }
        h2:after {
            content: "";
            display: block;
            width: 120px;
            height: 4px;
            background: #26a69a;
            margin: 12px auto;
            border-radius: 2px;
        }
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-top: 25px;
            border-radius: 10px;
            overflow: hidden;
        }
        th {
            background-color: #00897b;
            color: white;
            padding: 18px;
            text-align: left;
            font-weight: 500;
            font-size: 18px;
        }
        td {
            padding: 15px 18px;
            border-bottom: 1px solid #e0f2f1;
            font-size: 16px;
        }
        tr:last-child td {
            border-bottom: none;
        }
        tr:nth-child(even) {
            background-color: #e0f2f1;
        }
        tr:hover {
            background-color: #b2dfdb;
            transform: scale(1.01);
            transition: all 0.2s ease;
        }
        .price-high {
            color: #d32f2f;
            font-weight: bold;
        }
        .price-low {
            color: #2e7d32;
            font-weight: bold;
        }
        .last-updated {
            text-align: right;
            font-style: italic;
            color: #00695c;
            margin-top: 20px;
            font-size: 14px;
        }
        .fruit-icon {
            margin-right: 10px;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Fresh Fruit Market Prices</h2>
        <table>
            <tr>
                <th>Fruit</th>
                <th>Price (₹)</th>
            </tr>
            <tr>
                <td><span class="fruit-icon">🍎</span> Apple</td>
                <td class="price-high">120</td>
            </tr>
            <tr>
                <td><span class="fruit-icon">🍌</span> Banana</td>
                <td class="price-low">40</td>
            </tr>
            <tr>
                <td><span class="fruit-icon">🍊</span> Orange</td>
                <td>60</td>
            </tr>
            <tr>
                <td><span class="fruit-icon">🥭</span> Mango</td>
                <td class="price-high">80</td>
            </tr>
            <tr>
                <td><span class="fruit-icon">🍇</span> Grapes</td>
                <td>70</td>
            </tr>
            <tr>
                <td><span class="fruit-icon">🍉</span> Watermelon</td>
                <td class="price-low">30</td>
            </tr>
        </table>
    </div>
</body>
</html>
