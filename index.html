<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment Index</title>
    <style>
        :root {
            --primary: #4361ee;
            --secondary: #3a0ca3;
            --accent: #f72585;
            --light: #f8f9fa;
            --dark: #212529;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 50%, #7dd3fc 100%);
            background-attachment: fixed;
        }
        .container {
            max-width: 900px;
            margin: 40px auto;
            background: linear-gradient(145deg, rgba(255,255,255,0.98) 0%, rgba(248,249,255,0.95) 100%);
            border-radius: 20px;
            box-shadow: 0 15px 50px rgba(67, 97, 238, 0.15);
            padding: 40px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.5);
            border-top: 1px solid rgba(255,255,255,0.8);
            border-left: 1px solid rgba(255,255,255,0.8);
        }
        h1 {
            color: var(--secondary);
            text-align: center;
            margin-bottom: 40px;
            font-size: 2.8rem;
            font-weight: 700;
            position: relative;
            padding-bottom: 15px;
        }
        h1::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 4px;
            background: linear-gradient(to right, var(--primary), var(--accent));
            border-radius: 2px;
        }
        .assignment-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            padding: 0;
            list-style: none;
        }
        .assignment-button {
            display: flex;
            flex-direction: column;
            padding: 20px;
            background: linear-gradient(145deg, #ffffff 0%, #f0f4ff 100%);
            border-radius: 12px;    
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 8px rgba(67, 97, 238, 0.1);
            border: none;
            cursor: pointer;
            text-align: left;
            position: relative;
            overflow: hidden;
        }
        .assignment-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 24px rgba(67, 97, 238, 0.2);
            background: linear-gradient(145deg, #ffffff 0%, #e6ecff 100%);
        }
        .assignment-button::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 5px;
            height: 100%;
            background: linear-gradient(to bottom, var(--primary), var(--secondary));
            transition: all 0.3s ease;
        }
        .assignment-button:hover::before {
            width: 8px;
            background: linear-gradient(to bottom, var(--accent), #ff2d75);
        }
        .assignment-number {
            font-weight: bold;
            color: var(--secondary);
            margin-bottom: 5px;
            font-size: 1.1rem;
            transition: color 0.3s ease;
        }
        .assignment-button:hover .assignment-number {
            color: var(--accent);
        }
        .assignment-title {
            color: var(--dark);
            font-weight: 500;
            font-size: 1rem;
        }
        @media (max-width: 768px) {
            .container {
                margin: 20px;
                padding: 25px;
            }
            h1 {
                font-size: 2rem;
            }
            .assignment-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Assignment Portal</h1>
        <div class="assignment-grid">
            <button class="assignment-button" onclick="window.location.href='Assignment2.html'">
                <span class="assignment-number">Assignment 2</span>
                <span class="assignment-title">Simple Static Web Page</span>
            </button>
            <button class="assignment-button" onclick="window.location.href='Assignment3.html'">
                <span class="assignment-number">Assignment 3</span>
                <span class="assignment-title">Text Formatting Tags</span>
            </button>
            <button class="assignment-button" onclick="window.location.href='Assignment4.html'">
                <span class="assignment-number">Assignment 4</span>
                <span class="assignment-title">List Tags</span>
            </button>
            <button class="assignment-button" onclick="window.location.href='Assignment5.html'">
                <span class="assignment-number">Assignment 5</span>
                <span class="assignment-title">Image Display</span>
            </button>
            <button class="assignment-button" onclick="window.location.href='Assignment6.html'">
                <span class="assignment-number">Assignment 6</span>
                <span class="assignment-title">Iframe Example</span>
            </button>
            <button class="assignment-button" onclick="window.location.href='Assignment7.html'">
                <span class="assignment-number">Assignment 7</span>
                <span class="assignment-title">Link Targets</span>
            </button>
            <button class="assignment-button" onclick="window.location.href='Assignment8.html'">
                <span class="assignment-number">Assignment 8</span>
                <span class="assignment-title">Timetable</span>
            </button>
            <button class="assignment-button" onclick="window.location.href='Assignment9.html'">
                <span class="assignment-number">Assignment 9</span>
                <span class="assignment-title">Employee Registration</span>
            </button>
            <button class="assignment-button" onclick="window.location.href='Assignment10.html'">
                <span class="assignment-number">Assignment 10</span>
                <span class="assignment-title">Student Resume</span>
            </button>
            <button class="assignment-button" onclick="window.location.href='Assignment11.xml'">
                <span class="assignment-number">Assignment 11</span>
                <span class="assignment-title">XML using CSS</span>
            </button>
            <button class="assignment-button" onclick="window.location.href='Assignment12.htm'">
                <span class="assignment-number">Assignment 12</span>
                <span class="assignment-title">Fruit Price List</span>
            </button>
        </div>
    </div>
</body>
</html>
